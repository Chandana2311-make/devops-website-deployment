version: '3.8'

# ============================================================
#  Docker Compose — Multi-Container Setup (Optional Advanced)
#  Usage: docker-compose up -d
# ============================================================

services:

  # ── Website (Apache) ──────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops_website
    ports:
      - "80:80"
    volumes:
      - ./website:/usr/local/apache2/htdocs:ro
    restart: unless-stopped
    networks:
      - webnet
    labels:
      - "project=devops-mini-project"
      - "environment=production"

  # ── Nginx Reverse Proxy (Optional) ────────────────────
  nginx:
    image: nginx:alpine
    container_name: devops_nginx
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - webnet
    profiles:
      - nginx   # Only starts with: docker-compose --profile nginx up

networks:
  webnet:
    driver: bridge

volumes:
  web_data:
